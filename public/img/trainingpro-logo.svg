<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="TrainingPro">
  <!-- rounded square badge -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#23272F"/>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#tp-g)" opacity="0.0"/>
  <defs>
    <linearGradient id="tp-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F58220"/><stop offset="1" stop-color="#c46314"/>
    </linearGradient>
  </defs>
  <!-- graduation cap (mortarboard) in orange -->
  <path d="M60 30 L96 46 L60 62 L24 46 Z" fill="#F58220"/>
  <!-- cap underside / band -->
  <path d="M42 54 L42 70 C42 78 78 78 78 70 L78 54 L60 62 Z" fill="#e0731a"/>
  <!-- tassel -->
  <path d="M96 46 L96 64" stroke="#F5B82E" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <circle cx="96" cy="68" r="4.5" fill="#F5B82E"/>
  <!-- checkmark badge bottom-right -->
  <circle cx="86" cy="86" r="17" fill="#F5B82E"/>
  <path d="M79 86 L84 91 L94 80" fill="none" stroke="#23272F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
